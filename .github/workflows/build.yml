name: Build

# Release builds of the public (free) app: an APK and a Linux x64 bundle,
# uploaded as workflow artifacts. Runs when dev is proposed for main, when main
# moves, and by hand. Pro code lives in a private repo and is never part of
# these builds. The APK is signed with the debug key (no release keystore in
# the public repo), so it is for testing, not for publishing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.4
  # Equal to the flake's rust-overlay stable and to ci.yml: bump all together.
  RUST_TOOLCHAIN: 1.99.1

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      # cargokit builds rust/ for every ABI of the fat APK.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock', 'android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: android-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Resolve workspace
        run: flutter pub get

      # Same script as local builds; its read-only SDK workaround is a no-op here.
      - name: Build APK
        run: tool/build_apk.sh --release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kanaru-community-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Native libraries of flake.nix's nativeLibs plus the desktop toolchain.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev libsecret-1-dev libjsoncpp-dev libsqlite3-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: linux-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Resolve workspace
        run: flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release

      # A tarball keeps the bundle's file modes and its lib/ layout.
      - name: Pack bundle
        run: tar -C build/linux/x64/release -czf kanaru-community-linux-x64.tar.gz bundle

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kanaru-community-linux-x64-${{ github.sha }}
          path: kanaru-community-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
