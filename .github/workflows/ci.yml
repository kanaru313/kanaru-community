name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    name: Dart gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      # The analyzer plugin snapshot lives here; cache it between runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.dartServer
          key: dartserver-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'tool/architecture_lint/pubspec.lock') }}

      - name: Resolve workspace
        run: flutter pub get

      - name: Resolve architecture lint package
        working-directory: tool/architecture_lint
        run: dart pub get

      # flutter analyze, dart analyze (loads the architecture plugin),
      # tool/check_architecture.dart, flutter test (app and kanaru_ui) and the
      # gate's own tests. Same script as the local gate.
      - name: Gate
        run: tool/check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # SHA pinned; toolchain equal to the flake's rust-overlay stable
      # (`nix develop -c rustc --version`): bump both together.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-1.99.1-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.99.1-

      # cargo-audit is built once (pinned to the flake version) and cached; the step is skipped when present.
      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.2

      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      # cargo-deny: same scheme (version = the flake's).
      - name: Cache cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.20.2

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.20.2

      # fmt, unsafe grep, cargo audit, cargo deny, tests, clippy (no KANARU_PLUGIN_REPO: the
      # plugin compat test skips itself).
      - name: Rust gate
        run: tool/check_rust
