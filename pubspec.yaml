name: kanaru
description: "Material 3 music player for local files and your own cloud."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Pub workspace: members share one lockfile. kanaru_extensions is NOT a member
# (the private Pro repo overrides it), only a plain path dependency.
workspace:
  - packages/kanaru_ui
  - rust_builder

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

  # Audio playback (libmpv backend)
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7

  # Database & local storage
  drift: ^2.35.2
  sqlite3: ^3.7.1
  flutter_secure_storage: 11.2.0

  # UI, Icons & Colors
  dynamic_color: ^2.1.0
  material_color_utilities: any
  material_ui: ^1.7.0
  fluentui_system_icons: ^1.1.273
  flutter_svg: ^2.0.17
  table_calendar: ^3.3.0

  # Platform & Desktop integration
  dbus: ^0.8.0
  window_manager: ^0.5.2
  file_selector: ^1.1.0

  # Utilities & Networking
  archive: ^4.5.2
  crypto: ^3.0.7
  ffi: ^2.2.0
  intl: ^0.20.3
  logging: ^1.3.0
  shelf: ^1.4.3
  flutter_rust_bridge: 2.13.0
  rust_lib_kanaru:
    path: rust_builder
  path_provider: ^2.1.5

  # Workspace packages
  kanaru_ui:
    path: packages/kanaru_ui
  kanaru_extensions:
    path: packages/kanaru_extensions

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:

  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/Nunito-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
