# Modular drift: each file with tables gets its own .drift.dart so extension
# packages can import and extend the core tables.
targets:
  $default:
    auto_apply_builders: false
    builders:
      drift_dev:analyzer:
        enabled: true
        options: &options
          sql:
            dialects: [sqlite]
            options:
              modules: [fts5]
      drift_dev:modular:
        enabled: true
        options: *options
