# Lints for the app. Run `dart analyze` (not only `flutter analyze`): only it
# loads the architecture plugin below.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - linux/**
    # Cargokit tool vendored by flutter_rust_bridge; its own package.
    - rust_builder/**
    # The architecture plugin lives inside the app tree; analyzing it with the
    # app's options would make `dart analyze` silently check nothing.
    - tool/**
    # Generated code.
    - lib/src/rust/**
    - lib/l10n/gen/**
    - "**/*.g.dart"
    - "**/*.drift.dart"
  errors:
    avoid_dynamic_calls: error

# Architecture rules (architecture.yaml). Violations are errors and cannot be
# silenced with `// ignore:`; tool/check_architecture.dart rejects such comments.
plugins:
  kanaru_architecture:
    path: tool/architecture_lint

linter:
  rules:
    avoid_dynamic_calls: true
